<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="images/icon-192.png">
  <title>Заявка на книгу — Книжная полка · V04</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <p>Книжная полка · V04</p>
  </header>

  <div class="menu-wrap">
    <nav>
      <a href="index.html">Главная</a>
      <a href="catalog.html">Каталог</a>
    </nav>
  </div>

  <main class="page">
    <h1>Заявка на книгу</h1>
    <p>Учебная форма. Данные пока не сохраняются.</p>

    <form class="request-form" method="get">
      <fieldset>
        <legend>Что заказать</legend>
        <p class="form-field">
          <label for="book">Название книги</label>
          <select id="book" name="book" required>
            <option value="">— выберите книгу —</option>
            <option value="1984">1984</option>
            <option value="portrait">Портрет Дориана Грея</option>
            <option value="konets">Проект Конец Света</option>
          </select>
        </p>
        <p class="form-field">
          <label for="count">Количество экземпляров</label>
          <input type="number" id="count" name="count" min="1" step="1" value="2" required>
        </p>
      </fieldset>

      <fieldset>
        <legend>Пожелания и удобство чтения</legend>
        <p class="form-field">
          <label for="wishes">Пожелания к выдаче</label>
          <textarea id="wishes" name="wishes" rows="3" cols="30" placeholder="Опишите ваши пожелания"></textarea>
        </p>
        <p>
          <input type="checkbox" id="bookmark" name="bookmark" checked>
          <label for="bookmark">Нужна закладка</label>
        </p>
        <p>
          <input type="checkbox" id="bigfont" name="bigfont">
          <label for="bigfont">Нужен крупный шрифт</label>
        </p>
        <p class="form-field">
          <label for="volume">Объём книги (от «Короткая» до «Большая»)</label>
          Короткая <input type="range" id="volume" name="volume" min="1" max="5" value="2" aria-describedby="volume-help"> Большая
          <br>
          <small id="volume-help">1 — короткая, 5 — большая. Начальное значение — 2.</small>
        </p>
      </fieldset>

      <fieldset>
        <legend>Необязательно</legend>
        <p class="form-field">
          <label for="email">Учебная электронная почта (необязательно)</label>
          <input type="email" id="email" name="email" placeholder="student@example.com">
        </p>
      </fieldset>

      <p>
        <button type="submit">Оставить заявку</button>
      </p>
      
      
      <p id="result" role="status" aria-live="polite"></p>
    </form>

    <p><a href="index.html">Назад</a></p>
  </main>

  <footer>
    <p>Учебный прототип · Вариант 04</p>
  </footer>

  
  <script src="form.js" defer></script>
</body>
</html>
